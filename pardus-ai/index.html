<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pardus AI | Asistan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#020617;
    color:#f8fafc;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#4f46e520;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#4f46e540}
</style>
</head>
<body class="flex flex-col h-screen">

<header class="p-4 border-b border-slate-800 text-center text-xl font-bold bg-slate-950">
    🚀 Pardus AI Asistan
</header>

<main id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"></main>

<footer class="p-4 border-t border-slate-800 bg-slate-950 flex gap-2">
    <input id="input" type="text" placeholder="Mesajınızı yazın..."
        class="flex-1 p-3 rounded-xl bg-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
    <button onclick="sendMessage()"
        class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 font-semibold">
        Gönder
    </button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, sender){
    const div = document.createElement("div");
    div.className = sender === "user"
        ? "text-right"
        : "text-left";

    div.innerHTML = `
        <div class="inline-block max-w-xl px-4 py-3 rounded-2xl ${
            sender === "user"
            ? "bg-indigo-600"
            : "bg-slate-800"
        }">
            ${text}
        </div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function botReply(message){
    // Basit demo cevap sistemi
    if(message.toLowerCase().includes("merhaba")){
        return "Merhaba 👋 Ben Pardus AI. Sana nasıl yardımcı olabilirim?";
    }
    if(message.toLowerCase().includes("nasılsın")){
        return "Kodlarla yaşıyorum 😄 Sen nasılsın?";
    }
    if(message.toLowerCase().includes("kim yaptı")){
        return "Ben Yahya MACİT tarafından geliştiriliyorum 🚀";
    }
    return "Bu demo sürüm. Gerçek AI bağlamak için API eklememiz gerekiyor.";
}

function sendMessage(){
    const message = input.value.trim();
    if(!message) return;

    addMessage(message,"user");
    input.value = "";

    setTimeout(()=>{
        const reply = botReply(message);
        addMessage(reply,"bot");
    },500);
}

input.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});
</script>

</body>
</html>
